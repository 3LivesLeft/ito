# Gitleaks full-history scan. Preserve all default detection rules.
[extend]
useDefault = true

# Historical mock idempotency key, not a credential.
# Restrict the exception to this exact fixture path AND exact literal.
[[allowlists]]
description = "Mock messaging idempotency key in HA test fixture"
condition = "AND"
paths = ['^tests/ha/test_messaging\.py$']
regexes = ['click-0001']
