# MeshBeacon CI. All third-party actions are pinned to commit SHAs. CI never connects to public
# Reticulum peers: Python tests run inside a container with no network at all, and container
# tests use an internal Docker network with no route to the outside world (roadmap LP-19).
# Nothing is published from CI (no registry login, no push): release gates RG-1 to RG-12 apply.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE: ghcr.io/home-assistant/base-python:3.13-alpine3.24@sha256:c7d34ae22a87275d46deb65bcb0511b389d7bc6eb8dccb28d44dd7cb8616e603

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check meshbeacon/core custom_components tests tools
      - run: ruff format --check meshbeacon/core custom_components tests tools
      - run: mypy
      - name: Release layout (app store, Marketplace, one version everywhere)
        run: python tools/check_release.py
      - name: Panel and design-token tests, including WCAG contrast (Node's built-in runner; no packages)
        run: node --test tests/frontend/*.test.mjs
      - name: Shell scripts
        run: shellcheck meshbeacon/rootfs/etc/cont-init.d/10-meshbeacon meshbeacon/rootfs/etc/services.d/*/run meshbeacon/rootfs/etc/services.d/*/finish tests/container/build_localbase.sh
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: meshbeacon/Dockerfile
          ignore: DL3018 # apk pins come from the digest-pinned base image

  test:
    name: Unit and isolated-network integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Download test dependencies (network allowed only for this step)
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.13-slim \
            pip download -q -d /src/.wheelhouse -r requirements-test.txt
      - name: Run tests with no network access
        run: |
          docker run --rm --network none -v "$PWD:/src" -w /src python:3.13-slim sh -c '
            pip install -q --no-index --find-links /src/.wheelhouse -r requirements-test.txt &&
            python -m pytest -m "not container" -p no:cacheprovider'

  home-assistant:
    name: Home Assistant integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14" }
      - run: pip install -r requirements-ha-test.txt
      - name: Type check (strict, against Home Assistant's own types)
        run: mypy --strict --python-version 3.14 custom_components/meshbeacon
      - name: Integration tests (HTTP mocked or on 127.0.0.1 only; no network)
        run: >-
          python -m pytest tests/ha -p no:cacheprovider
          -o "pythonpath=meshbeacon/core ." -o asyncio_mode=auto

  home-assistant-release:
    name: Home Assistant 2026.11.2 (reference release) smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.14" }
      - name: Install Home Assistant in a virtual environment (it refuses to run outside one)
        run: python -m venv "$RUNNER_TEMP/ha" && "$RUNNER_TEMP/ha/bin/pip" install -r requirements-ha-smoke.txt
      - name: Type check against this release
        run: '"$RUNNER_TEMP/ha/bin/mypy" --strict --python-version 3.14 custom_components/meshbeacon'
      - name: Real Home Assistant with the integration and a fake status API (127.0.0.1 only)
        run: '"$RUNNER_TEMP/ha/bin/python" tools/ha_smoke_test.py --hass-python "$RUNNER_TEMP/ha/bin/python" --seconds 200'

  container:
    name: Container tests (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            emulated: "0"
          - arch: aarch64
            platform: linux/arm64
            emulated: "1"  # QEMU emulation — NOT physical Raspberry Pi validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.emulated == '1'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (pinned HA base image)
        run: |
          docker buildx build --load --platform "${{ matrix.platform }}" \
            --build-arg BUILD_ARCH=${{ matrix.arch }} \
            -t "meshbeacon:ci-${{ matrix.arch }}" meshbeacon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install -r requirements-test.txt
      - name: Container security and behaviour tests
        env:
          MESHBEACON_IMAGE: meshbeacon:ci-${{ matrix.arch }}
          MESHBEACON_EMULATED: ${{ matrix.emulated }}
        run: python -m pytest -m container tests/container -s -p no:cacheprovider
      - name: Load the AppArmor profile into the runner's kernel (enforce mode)
        if: (success() || failure()) && matrix.arch == 'amd64'
        run: |
          sudo aa-status --enabled
          # The Supervisor renames the profile to the app slug; here it is renamed for CI.
          sed 's/^profile meshbeacon /profile meshbeacon-ci /' meshbeacon/apparmor.txt > "$RUNNER_TEMP/meshbeacon-ci"
          sudo apparmor_parser --replace --write-cache "$RUNNER_TEMP/meshbeacon-ci"
          sudo aa-status | grep -q meshbeacon-ci
      - name: Container tests confined by the MeshBeacon AppArmor profile
        # Run even if the unconfined tests failed, so profile problems are always reported.
        if: (success() || failure()) && matrix.arch == 'amd64'
        env:
          MESHBEACON_IMAGE: meshbeacon:ci-${{ matrix.arch }}
          MESHBEACON_EMULATED: ${{ matrix.emulated }}
          MESHBEACON_APPARMOR: meshbeacon-ci
        run: |
          python -m pytest -m container tests/container -s -p no:cacheprovider -x \
            -k "not covers_every_program" || {
            echo "--- logs of the last MeshBeacon container ---"
            docker ps -a --format '{{.Names}}' | grep '^mb-' | tail -1 | xargs -r docker logs | tail -40
            exit 1
          }
      - name: No unexpected AppArmor denials
        # Every denial is printed for diagnosis. The job fails on any denial other than the two the
        # confinement test provokes on purpose (a write to /usr/local/lib, an exec from /data).
        if: (success() || failure()) && matrix.arch == 'amd64'
        run: |
          sleep 2
          sudo journalctl -k --no-pager | grep -E 'apparmor="(DENIED|ALLOWED)".*meshbeacon-ci' > "$RUNNER_TEMP/denials" || true
          tail -100 "$RUNNER_TEMP/denials"
          if grep -vE 'name="/(usr/local/lib/mb-test|data/mb-busybox)"' "$RUNNER_TEMP/denials"; then
            echo "::error::Unexpected AppArmor denials (above)"
            exit 1
          fi
      - name: Python dependency licences inside the image
        run: |
          docker run --rm --entrypoint python3 "meshbeacon:ci-${{ matrix.arch }}" -I -c '
          import importlib.metadata as m
          for d in sorted(m.distributions(), key=lambda d: d.metadata["Name"].lower()):
              md = d.metadata
              print(md["Name"], d.version, "|", md.get("License-Expression") or md.get("License") or "")'
      - name: SBOM (SPDX)
        if: matrix.arch == 'amd64'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: meshbeacon:ci-amd64
          format: spdx-json
          output-file: sbom-amd64.spdx.json
          upload-artifact: true
      - name: Licence allow-list check
        if: matrix.arch == 'amd64'
        run: python tools/check_licences.py sbom-amd64.spdx.json
      - name: Image vulnerability scan
        if: matrix.arch == 'amd64'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: meshbeacon:ci-amd64
          fail-build: true
          severity-cutoff: critical
          output-format: table

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - run: pip install pip-audit==2.10.0
      - name: Vulnerability scan of pinned runtime dependencies
        run: pip-audit --require-hashes --disable-pip --no-deps -r meshbeacon/requirements.txt
      - name: Secret scan (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose
