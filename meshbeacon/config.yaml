# MeshBeacon — Home Assistant app (formerly add-on) configuration.
# Security posture (docs/architecture.md §5): no host network, no published ports, no Supervisor
# or Home Assistant API access, no extra capabilities, no device access, custom AppArmor profile.
name: MeshBeacon
version: "0.1.2"
slug: meshbeacon
description: Decentralised connectivity for your home — a private Reticulum node.
url: https://github.com/3LivesLeft/meshbeacon
arch:
  - aarch64
  - amd64
stage: experimental
init: false
startup: services
boot: auto
timeout: 20
apparmor: true
watchdog: "http://[HOST]:[PORT:8099]/health"
backup: hot
backup_exclude:
  - "reticulum/storage/cache/*"
  - "reticulum/storage/resources/*"
ulimits:
  nofile: 4096
options:
  peers: []
  transport: false
  log_level: normal
  memory_limit_mb: 256
  replace_identity: false
schema:
  peers:
    - name: "match(^[A-Za-z0-9](?:[A-Za-z0-9 _.-]{0,30}[A-Za-z0-9_.-])?$)"
      host: "match(^[A-Za-z0-9.:-]{1,253}$)"
      port: port
      network_name: "match(^[A-Za-z0-9](?:[A-Za-z0-9 _.-]{0,30}[A-Za-z0-9_.-])?$)?"
      passphrase: "password?"
  transport: bool
  log_level: list(quiet|normal|detailed)
  memory_limit_mb: "int(128,1024)"
  replace_identity: bool
# No `image:` key: the app is built locally until public release gates RG-1 to RG-12 are met.
