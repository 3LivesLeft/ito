configuration:
  peers:
    name: Your own peers
    description: >-
      Reticulum nodes to connect to, such as a friend's node or your own node elsewhere. Each needs
      a name you choose, a host (for example rns.example.org or an IP address) and a port. Network
      name and passphrase are only needed if the peer's operator gave you them.
      Privacy: the operator of each peer can see your home's public IP address and how much data
      you exchange. They cannot read your end-to-end-encrypted Reticulum traffic. MeshBeacon makes
      no connections until you add a peer.
  transport:
    name: Share my connection with others (transport mode)
    description: >-
      Off (recommended for most people): your node uses the network but does not carry other
      people's traffic. On: your node also passes traffic between other Reticulum users, which
      helps the network grow. Only turn it on if Home Assistant is always on and your internet plan
      has data to spare — on a busy network this can use a noticeable amount of data.
  log_level:
    name: Log detail
    description: >-
      How much MeshBeacon and Reticulum write to the Log tab. "normal" is right for most people.
      "detailed" helps with troubleshooting; addresses and keys are always removed from the log.
  memory_limit_mb:
    name: "Advanced: memory limit (MB)"
    description: >-
      If the Reticulum service uses more memory than this, MeshBeacon restarts it to protect Home
      Assistant. The default (256 MB) suits almost everyone.
  replace_identity:
    name: "Advanced: replace identity on next start"
    description: >-
      Creates a new identity for your node, which gives it a new address. Only use this if you
      really want to start again. The previous identity is kept in the app's data folder. Switch
      this off again after the restart; MeshBeacon will not start while it is left on.
