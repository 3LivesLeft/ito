<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <!-- ito mark (master, PROVISIONAL pending visual review): a thread encircling the earth. Redrawn
       from the provisional emblem first proposed in brand/logo.svg (PR #12), scaled to fill the
       canvas. Globe and grid in deep green, the thread in sage, ending in a node. -->
  <title>ito</title>
  <style>
    .globe{fill:none;stroke:#284C40;stroke-width:12}
    .grid{fill:none;stroke:#284C40;stroke-width:8;stroke-linecap:round}
    .thread{fill:none;stroke:#A6C9B2;stroke-width:18;stroke-linecap:round}
    .node{fill:#284C40}
  </style>
  <circle class="globe" cx="128" cy="128" r="100"/>
  <path class="grid" d="M128 28a45 100 0 0 1 0 200a45 100 0 0 1 0-200z"/>
  <path class="grid" d="M28 128h200M44 75h168M44 181h168"/>
  <path class="thread" d="M36 184c50-72 129-101 188-109"/>
  <circle class="node" cx="224" cy="75" r="15"/>
</svg>
