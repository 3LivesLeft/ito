<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <!-- MeshBeacon small-format mark (16–48 px): ring, lighthouse and lamp, hill and two nodes; no waves (they blur at 16 px). -->
  <title>MeshBeacon</title>
  <style>
    .ring{fill:none;stroke:#0EA5E9;stroke-width:16;stroke-linecap:round}
    .wave{fill:none;stroke:#0EA5E9;stroke-width:16;stroke-linecap:round}
    .tower{fill:#F8FAFC}
    .lamp{fill:#F59E0B}
    .hill{fill:#0F2747;stroke:#0EA5E9;stroke-width:12;stroke-linejoin:round}
    .link{fill:none;stroke:#38BDF8;stroke-width:8;stroke-linecap:round}
    .node{fill:#F8FAFC;stroke:#0EA5E9;stroke-width:5}
  </style>
  <path class="ring" d="M32 168A100 100 0 1 1 224 168"/>
  <path class="tower" d="M128 40l28 30h-56z"/>
  <rect class="lamp" x="106" y="70" width="44" height="34" rx="4"/>
  <path class="tower" d="M106 104h44l14 92h-72z"/>
  <path class="hill" d="M20 216c40-30 76-36 108-28s68 0 108 28z"/>
  <circle class="node" cx="70" cy="200" r="13"/>
  <circle class="node" cx="186" cy="200" r="13"/>
</svg>
